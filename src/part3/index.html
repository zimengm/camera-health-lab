<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assignment 4 · BFSK 发送端</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10141c;color:#ecf1f9;font:16px system-ui}main{max-width:1000px;margin:30px auto;padding:20px}h1{font-size:25px}p{line-height:1.65;color:#c1cddd}.controls{display:flex;flex-wrap:wrap;gap:18px;margin:24px 0}label{display:grid;gap:8px}input,select,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #53657c}input,select{background:#182334;color:white;width:140px}button{background:#ade6cf;color:#102119;cursor:pointer}button:disabled{opacity:.4;cursor:default}#stage{background:#000;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid #44536c}#picture{width:100%;height:100%;display:block}#stage:fullscreen{width:100vw;height:100vh;border:0;aspect-ratio:auto}#status{min-height:50px;font-weight:600}a{color:#ade6cf}.note{font-size:14px}
</style>
<main>
<h1>屏幕 → 摄像头 BFSK 发送端</h1>
<p>实时接收：先在手机 Safari 打开<a href="https://vital-visions-phone-receiver.jadechime2.chatgpt.site" target="_blank" rel="noopener">手机接收页面</a>并允许摄像头，再点击下方「全屏发送」。让手机镜头对准图片中央，发送过程中保持此电脑页面在前台。</p>
<div class="controls">
<label>透明度差 Δα<select id="delta"><option value="0.5">0.5（先测试）</option><option value="0.1">0.1</option></select></label>
<label>每比特时间<select id="symbol"><option value="0.5">0.5 秒 / 2 bps</option><option value="0.4">0.4 秒 / 2.5 bps</option><option value="0.25">0.25 秒 / 4 bps</option></select></label>
<label>距离（记录用）<select id="distance"><option>20</option><option>40</option><option>80</option><option>120</option></select></label>
<label>消息（1–16 ASCII 字符）<input id="message" maxlength="16" value="HELLO"></label>
</div>
<p id="summary"></p><button id="start">全屏发送</button> <button id="save" disabled>下载本次发送日志</button>
<p id="status">正在载入协议…</p>
<div id="stage">
<svg id="picture" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="静态山水图片">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d3e9f5"/><stop offset="1" stop-color="#f5e9cb"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#8abec6"/><stop offset="1" stop-color="#366c84"/></linearGradient></defs>
<path fill="url(#sky)" d="M0 0H1600V900H0z"/><circle cx="1250" cy="190" r="85" fill="#fff4cf"/>
<path fill="#a2bac7" d="M0 600L230 380 450 560 690 330 1000 600 1270 390 1600 610V900H0z"/>
<path fill="#668c9e" d="M0 700L330 540 540 660 950 470 1350 700 1600 570V900H0z"/>
<path fill="url(#water)" d="M0 720Q600 620 1600 740V900H0z"/>
<path fill="none" stroke="#d2e6dc" stroke-width="5" opacity=".5" d="M550 780H1050M300 825H850M1000 860H1450"/>
</svg>
</div>
<p class="note">0 → 4 Hz；1 → 10 Hz。图片 opacity 在 1−Δα 与 1 之间做正弦变化，背景为黑色。前导码用于同步，消息按 ASCII、每字节高位优先发送。此页面是发送端；手机录像后的离线解码用于先验证链路。</p>
</main>
<script>
let protocol, lastLog=null, running=false;
const $=id=>document.getElementById(id);
function bitsOf(s){return [...s].flatMap(c=>c.charCodeAt(0).toString(2).padStart(8,'0').split('').map(Number));}
function update(){if(!protocol)return; const n=protocol.preamble.length+bitsOf($('message').value).length; $('summary').textContent=`完整画面约 ${(protocol.lead_seconds+n*Number($('symbol').value)+protocol.tail_seconds).toFixed(1)} 秒。录像请覆盖发送前后各 2–3 秒。`;}
fetch('protocol.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(p=>{protocol=p;$('status').textContent='就绪：先拍 20 cm、Δα=0.5、0.5 秒/bit 的测试。';update()}).catch(e=>{$('status').textContent='请通过本地服务器打开此页：python serve.py。'+e.message;$('start').disabled=true;});
for(const id of ['symbol','message'])$(id).addEventListener('input',update);
$('start').onclick=async()=>{
 if(!protocol||running)return;
 const message=$('message').value;
 if(!/^[\x20-\x7e]{1,16}$/.test(message)){alert('请输入 1–16 个可打印 ASCII 字符。');return;}
 const config={message,delta:Number($('delta').value),symbol:Number($('symbol').value),distance_cm:Number($('distance').value)};
 const bits=[...protocol.preamble].map(Number).concat(bitsOf(message));
 const end=protocol.lead_seconds+bits.length*config.symbol;
 let previous, begin;
 running=true;$('start').disabled=true;$('save').disabled=true;
 lastLog={protocol,config,started_at:new Date().toISOString(),frames:[],aborted:false};
 try{await $('stage').requestFullscreen();}catch(e){$('status').textContent='未进入全屏，继续发送；请只拍摄图片区域。';}
 let wake;try{wake=await navigator.wakeLock?.request('screen');}catch(e){}
 const finish=async(aborted)=>{
  running=false;lastLog.aborted=aborted;$('picture').style.opacity='1';
  const gaps=lastLog.frames.slice(1).map((x,i)=>x.t-lastLog.frames[i].t);
  lastLog.max_frame_gap_seconds=gaps.length?Math.max(...gaps):null;
  const active=lastLog.frames.filter(x=>x.index>=0);
  const activeGaps=active.slice(1).map((x,i)=>x.t-active[i].t);
  lastLog.active_max_frame_gap_seconds=activeGaps.length?Math.max(...activeGaps):null;
  lastLog.active_average_fps=active.length>1?(active.length-1)/(active.at(-1).t-active[0].t):0;
  const unstable=!aborted&&(lastLog.active_average_fps<40||lastLog.active_max_frame_gap_seconds>.08);
  lastLog.elapsed_seconds=lastLog.frames.length?lastLog.frames.at(-1).t:0;
  $('start').disabled=false;$('save').disabled=false;
  $('status').textContent=aborted?'发送中断，请重新录制。':`发送结束，可以停止录像。请下载日志。调制期间平均 ${lastLog.active_average_fps.toFixed(1)} fps，最大更新间隔 ${(1000*(lastLog.active_max_frame_gap_seconds||0)).toFixed(1)} ms。${unstable?' 显示更新不稳定：请使用桌面 Chrome，关闭其他繁忙程序后重试。':''}`;
  if(document.fullscreenElement)try{await document.exitFullscreen();}catch(e){}
  if(wake)await wake.release();
 };
 function tick(now){
  if(!running)return;
  if(begin===undefined)begin=now;
  const t=(now-begin)/1000;
  if(document.hidden){finish(true);return;}
  let alpha=1,index=-1,frequency=0;
  if(t>=protocol.lead_seconds&&t<end){
   const elapsed=t-protocol.lead_seconds;index=Math.floor(elapsed/config.symbol);
   frequency=bits[index]?protocol.f1_hz:protocol.f0_hz;
   const local=elapsed-index*config.symbol;
   alpha=1-config.delta/2+config.delta/2*Math.cos(2*Math.PI*frequency*local);
  }
  $('picture').style.opacity=String(alpha);
  lastLog.frames.push({t,alpha,index,frequency});
  if(t>=end+protocol.tail_seconds){finish(false);return;}
  previous=now;requestAnimationFrame(tick);
 }
 $('status').textContent='发送中，请保持页面在前台。';requestAnimationFrame(tick);
};
$('save').onclick=()=>{if(!lastLog)return;const c=lastLog.config;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(lastLog,null,2)],{type:'application/json'}));a.download=`tx_d${c.distance_cm}_a${c.delta}_T${c.symbol}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script>
</html>
