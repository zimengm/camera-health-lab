<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部通信测试 · 批量发送</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b16;color:#edf5ee;font:16px system-ui}main{max-width:980px;margin:30px auto;padding:20px}h1{font-size:28px}p{color:#b4cbbb;line-height:1.7}button,select{font:inherit;border:1px solid #597563;border-radius:8px;padding:12px;background:#192d22;color:white}button{background:#d2f4a8;color:#132415;cursor:pointer}button:disabled{opacity:.4}#stage{position:relative;background:black;width:100%;aspect-ratio:16/9}#picture{width:100%;height:100%;display:block}#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}#overlay{position:absolute;top:12px;left:12px;background:#000b;color:white;padding:12px;border-radius:8px;font-size:15px}#countdown{font-size:13px;margin-top:5px;color:#c5deb4}.observation{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #35543f;padding:10px 0;gap:15px}#notice{color:#d2f4a8}a{color:#d2f4a8}
</style><main><h1>一次完成一个距离的全部测试</h1><p>手机打开新版接收页面，默认使用「自动」速度。先等采样点数持续增加，固定好手机后再开始。每组 6 次发送，分别覆盖两种透明度差和三档速度。手机这期间不移动。</p><label>手机距屏幕 <select id="distance"><option>20</option><option>40</option><option>80</option><option>120</option></select> cm</label><p id="duration"></p><button id="start" disabled>开始本距离的 6 项测试</button> <button id="save" disabled>保存电脑批量日志</button><p id="status">准备中。</p><div id="stage"><svg id="picture" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="静态山水图片">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d3e9f5"/><stop offset="1" stop-color="#f5e9cb"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#8abec6"/><stop offset="1" stop-color="#366c84"/></linearGradient></defs>
<path fill="url(#sky)" d="M0 0H1600V900H0z"/><circle cx="1250" cy="190" r="85" fill="#fff4cf"/>
<path fill="#a2bac7" d="M0 600L230 380 450 560 690 330 1000 600 1270 390 1600 610V900H0z"/>
<path fill="#668c9e" d="M0 700L330 540 540 660 950 470 1350 700 1600 570V900H0z"/>
<path fill="url(#water)" d="M0 720Q600 620 1600 740V900H0z"/>
<path fill="none" stroke="#d2e6dc" stroke-width="5" opacity=".5" d="M550 780H1050M300 825H850M1000 860H1450"/>
</svg><div id="overlay" hidden><div id="label"></div><div id="countdown"></div><div id="notice"></div></div></div><h2>肉眼闪烁观察</h2><p>发送期间按电脑数字键：0 看不出、1 轻微、2 明显。也可结束后在这里填写；记不清就选「没留意」，不要猜。</p><div id="observations"></div><p>每个距离结束，手机「停止 → 保存本次接收数据」，电脑保存批量日志。接着换距离，手机重新打开摄像头，再开始下一组。</p></main><script src="batch.js"></script></html>
