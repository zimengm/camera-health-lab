<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通信与可见性补测</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b16;color:#edf5ee;font:16px system-ui}main{max-width:980px;margin:28px auto;padding:20px}h1{font-size:28px}p{line-height:1.7;color:#bbd0c0}button,input,select{font:inherit;border:1px solid #597563;border-radius:8px;padding:11px;background:#192d22;color:white}button{background:#d2f4a8;color:#132415;cursor:pointer}button:disabled{opacity:.4}.settings{display:flex;flex-wrap:wrap;gap:16px}label{display:grid;gap:8px}#stage{position:relative;background:#000;aspect-ratio:16/9;width:100%;margin-top:20px}#stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}#picture{display:block;width:100%;height:100%}#overlay{position:absolute;left:12px;top:12px;padding:12px;border-radius:8px;background:#000c;font-size:15px}#countdown,#notice{font-size:13px;margin-top:5px}.observation{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #35543f;padding:10px 0}a{color:#d2f4a8}.buttons{display:flex;gap:12px;margin:18px 0}</style>
<main><h1>通信与可见性补测</h1><p>手机固定在屏幕前，自己也保持固定位置。关闭自动亮度，整轮保持屏幕亮度和灯光不变。手机接收页选择「可见性补测」，速度保持「自动」，确认采样超过 50 次/秒后再开始。</p>
<div class="settings"><label>手机距屏幕<select id="distance"><option>20</option><option>40</option><option>80</option><option>120</option></select></label><label>第几轮<select id="repeat"><option>1</option><option>2</option><option>3</option></select></label><label>眼睛距屏幕（cm）<input id="observer" type="number" min="20" max="300" value="50"></label><label>房间灯光<input id="lighting" required placeholder="例如：顶灯开，窗帘关"></label></div>
<p id="duration"></p><p>观察发送时的图片：按 <b>0 看不出、1 轻微、2 明显</b>。没有看到就留空或选「没观察」，不要猜。先做 20 cm 第 1 轮；分析后再决定是否需要重复。</p>
<div class="buttons"><button id="start">开始这一轮</button><button id="stop" disabled>中断</button><button id="save" disabled>保存电脑日志</button></div><p id="status" role="alert" aria-live="polite">等待手机就绪。</p><div id="stage"><svg id="picture" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="静态山水图片">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d3e9f5"/><stop offset="1" stop-color="#f5e9cb"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#8abec6"/><stop offset="1" stop-color="#366c84"/></linearGradient></defs>
<path fill="url(#sky)" d="M0 0H1600V900H0z"/><circle cx="1250" cy="190" r="85" fill="#fff4cf"/>
<path fill="#a2bac7" d="M0 600L230 380 450 560 690 330 1000 600 1270 390 1600 610V900H0z"/>
<path fill="#668c9e" d="M0 700L330 540 540 660 950 470 1350 700 1600 570V900H0z"/>
<path fill="url(#water)" d="M0 720Q600 620 1600 740V900H0z"/>
<path fill="none" stroke="#d2e6dc" stroke-width="5" opacity=".5" d="M550 780H1050M300 825H850M1000 860H1450"/>
</svg><div id="overlay" hidden><div id="label"></div><div id="countdown"></div><div id="notice"></div></div></div><h2>本轮观察记录</h2><div id="observations"></div><p><a href="batch.html">原来的四距离实验</a> · <a href="/receiver/?v=4&profile=rate-coupled">本机接收页预览</a>（iPhone 请打开给你的 HTTPS 链接）</p></main><script src="refine_plan.js"></script><script src="refine.js?v=2"></script></html>
